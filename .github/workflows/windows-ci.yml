name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test Windows
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build windows/OpenUsage.sln --configuration Release
      - run: dotnet test windows/OpenUsage.sln --configuration Release --no-build
      - name: Verify self-contained x64 publish
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'openusage-win-x64'
          ./windows/package.ps1 -OutputDirectory $output
          foreach ($file in @('app/OpenUsage.exe', 'app/PresentationFramework.dll',
                              'app/coreclr.dll', 'cli/coreclr.dll')) {
            if (!(Test-Path -LiteralPath (Join-Path $output $file) -PathType Leaf)) {
              throw "Published file is missing: $file"
            }
          }
          & (Join-Path $output 'cli/openusage.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
