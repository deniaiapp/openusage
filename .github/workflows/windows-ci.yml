name: Windows CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test Windows
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build windows/OpenUsage.sln --configuration Release
      - run: dotnet test windows/OpenUsage.sln --configuration Release --no-build
      - name: Verify self-contained x64 ZIP
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'windows-x64-unsigned'
          ./windows/package.ps1 -OutputDirectory $output -Zip
          $extracted = "$output-extracted"
          Expand-Archive -LiteralPath "$output.zip" -DestinationPath $extracted
          foreach ($file in @('app/OpenUsage.exe', 'app/PresentationFramework.dll',
                              'app/coreclr.dll', 'cli/coreclr.dll')) {
            if (!(Test-Path -LiteralPath (Join-Path $extracted $file) -PathType Leaf)) {
              throw "Packaged file is missing: $file"
            }
          }
          & (Join-Path $extracted 'cli/openusage.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save verified ZIP
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-unsigned
          path: ${{ runner.temp }}/windows-x64-unsigned.zip
          if-no-files-found: error
          compression-level: 0
