name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test Windows
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build windows/OpenUsage.sln --configuration Release
      - run: dotnet test windows/OpenUsage.sln --configuration Release --no-build
